# Hyper-parameters. Values marked (paper) come from Sec. 3.3; the rest are
# not reported in the paper and are our choices, shared by every system.
# Unreported values may be tuned ONLY on the dev tasks (protocol.yaml
# dev_tasks: *-UR and EN-EN). NOT FROZEN (2026-11-26): after switching the PEFT to [14]'s,
# feature_layer and lr are being re-selected on dev data (see CLAUDE.md). Freeze before Table 2 runs.
lambda_xling: 2.5        # (paper) language-aware SupCon weight for cross-lingual positives
alpha: 1.0               # (paper) SupCon loss weight
beta: 0.3                # (paper) speaker-adversarial loss weight
n_lang: 3                # (paper) hierarchical sampler
n_cls: 4                 # (paper)
n_sam: 3                 # (paper) -> 36 utterances per batch (also used by random batches)
temperature: 0.07
grl_coeff: 1.0
spk_hidden: 256
spk_dropout: 0.1
# PEFT follows the code of the paper's baseline reference [14] (Han et al. 2025): LoRA on
# q/k/v/out + both FFN linears of every kept layer, parallel bottleneck adapter, weight gating.
lora_rank: 8             # [14]
lora_alpha: 16           # [14]
lora_dropout: 0.1        # [14]
adapter_dim: 48          # [14] (768 / reduction factor 16)
feature_layer:           # encoder truncated after this many transformer layers, per SOURCE backbone.
  EN: 4                  # Selected 2026-11-28 by scripts/layerwise_probe.py on dev data only (URDU + MELD;
  CN: 5                  # frozen backbone, linear probe per layer, best mean UAR of the two corpora,
  DE: 3                  # ties -> lower layer). FR: layer 1 67.9 vs layer 5 67.1 / layer 10 67.0,
  FR: 1                  # within noise but kept as the pre-registered rule dictates.
lr: 3.0e-4               # PROVISIONAL: re-select under the [14] PEFT. Previous (old PEFT, last layer) sweep,
                         # score = (URDU val mean + MELD val) / 2:
                         # 1e-4 66.13, 3e-4 68.62, 1e-3 61.88, 3e-3 59.06. 1e-3 collapses on MELD
                         # (grad norm -> 0.35, pooled-feature norm 5 -> 2.8, CE back to the prior entropy).
weight_decay: 0.01
class_weighted_ce: false   # weight emotion CE by inverse class frequency of the training rows
                         # (random-batch systems only; hierarchical batches are already class-balanced)
max_steps: 3000          # optimizer-step budget, identical for every system
warmup_steps: 100        # linear warm-up, then cosine decay to 0 at max_steps
eval_every: 100          # score the val split every N steps
patience: null           # no early termination: always train max_steps and keep the checkpoint
                         # with the best val UAR (mean per-language UAR of the training languages).
                         # patience 8 cut MELD runs during their 300-800+ step prior-only plateau.
grad_clip: 5.0
max_train_sec: 6.0       # random crop during training
max_eval_sec: 15.0       # deterministic head crop for val / test
eval_batch_size: 16
num_workers: 4
seed: 0
deterministic: true      # cuDNN deterministic kernels + torch deterministic algorithms (warn only)
